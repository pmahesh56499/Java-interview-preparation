<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Java Test | Interview Prep</title><link rel="stylesheet" href="styles.css"><style>
.test-page{max-width:900px;margin:auto;padding:40px 20px 80px}.back{color:var(--accent-dark);font-weight:700;text-decoration:none}.test-head{margin:28px 0}.test-head h1{font-size:clamp(34px,6vw,54px);margin:8px 0}.muted{color:var(--muted)}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:18px 0 28px}.progress span{display:block;height:100%;background:var(--accent-dark);width:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:25px}.option{display:block;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option:hover{border-color:var(--accent-dark)}.option input{margin-right:10px}.buttons{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--accent-dark);color:#fff}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.result{display:none}.score{font-size:54px;font-weight:800;margin:10px 0}.review{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:12px}.wrong{border-left:4px solid #d44;padding-left:14px}.right{border-left:4px solid #398a58;padding-left:14px}.explain{color:var(--muted);margin-top:8px}.restart{margin-top:20px}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span>Java Interview Prep</span></a><nav class="nav"><a href="index.html#topics">Topics</a><a href="index.html#practice">Practice</a></nav><button class="theme-btn" id="themeBtn">◐</button></header>
<main class="test-page"><a class="back" href="index.html#topics">← Back to topics</a><div id="quiz"></div></main>
<script>
const BANK={
'core-java':[
['What is the difference between JDK, JRE and JVM?',['JDK is for development, JRE is the runtime environment, JVM executes bytecode.','JDK only contains JVM','JRE is a compiler','JVM is a Java IDE'],0,'JDK provides development tools, JRE provides runtime libraries and JVM executes bytecode.'],
['For objects, what does == compare?',['Logical content','Reference identity','Hash codes','Class names'],1,'For object references, == checks whether two references point to the same object.'],
['Which method is normally used for logical object equality?',['compareTo()','hashCode()','equals()','toString()'],2,'equals() is used for logical equality when the class implements the appropriate contract.'],
['Why should equals() and hashCode() agree?',['For loops','Hash-based collections','Compilation only','Garbage collection'],1,'Equal objects must have equal hash codes so HashMap and HashSet can locate them correctly.'],
['Is Java pass-by-reference?',['Yes','Only for objects','Only for arrays','No, Java is pass-by-value'],3,'Java always passes arguments by value. For objects, the value copied is a reference.'],
['Which type is mutable?',['String','StringBuilder','Integer','LocalDate'],1,'StringBuilder is mutable; String is immutable.'],
['What does final on a class mean?',['Cannot create objects','Cannot extend the class','Cannot call methods','Cannot have fields'],1,'A final class cannot be subclassed.'],
['What happens if a method is overloaded?',['Resolved at compile time','Always runtime','Never compiled','Only JVM decides after execution'],0,'Overload resolution is performed at compile time based on the method signature and applicable arguments.'],
['Which keyword calls a parent constructor?',['this','parent','super','base'],2,'super() invokes the immediate superclass constructor.'],
['What is try-with-resources used for?',['Loops','Automatic resource closing','Thread creation','Object cloning'],1,'Resources implementing AutoCloseable are automatically closed at the end of the try statement.'],
['Which is a checked exception?',['NullPointerException','ArithmeticException','IOException','IllegalArgumentException'],2,'IOException is checked; RuntimeException subclasses such as NullPointerException are unchecked.'],
['Which collection concept depends on equals and hashCode?',['HashMap keys','Array indexing','for loops','StringBuilder'],0,'HashMap and HashSet rely on hashing and equality contracts.'],
['What does Comparable provide?',['A natural ordering','Database connection','Thread synchronization','Serialization only'],0,'Comparable defines natural ordering through compareTo().'],
['What does a final reference mean?',['The object is immutable','The reference cannot be reassigned','The object cannot be garbage collected','The class is final'],1,'The reference cannot point to another object, but the referenced object may still be mutable.'],
['What is garbage collection?',['Manual memory free','Automatic reclamation of unreachable objects','Database cleanup','Compilation'],1,'The JVM automatically reclaims memory occupied by objects that are no longer reachable.'] ],
'oop':[
['What are the four pillars of OOP?',['Encapsulation, inheritance, polymorphism, abstraction','Classes, methods, loops, arrays','JDK, JRE, JVM, GC','List, Set, Map, Queue'],0,'The four commonly cited pillars are encapsulation, inheritance, polymorphism and abstraction.'],
['What does encapsulation focus on?',['Hiding and controlling internal state','Creating multiple JVMs','Sorting arrays','Compiling code'],0,'Encapsulation protects internal state and exposes controlled operations.'],
['Which keyword is used for class inheritance?',['implements','extends','inherits','super'],1,'A class extends another class.'],
['Can a Java class extend two classes?',['Yes','Only if both are abstract','No','Only with final'],2,'Java supports single inheritance for classes.'],
['Can a class implement multiple interfaces?',['No','Yes','Only two','Only if interfaces are empty'],1,'A class can implement multiple interfaces.'],
['Which is runtime polymorphism?',['Method overriding','Variable declaration','Method overloading','Constructor overloading'],0,'Overridden instance methods are dynamically dispatched at runtime.'],
['Can return type alone overload a method?',['Yes','No','Only with static','Only in interfaces'],1,'A method signature cannot be distinguished by return type alone.'],
['Can static methods be overridden?',['Yes','No, they are hidden','Only if final','Only in abstract classes'],1,'Static methods belong to the class and are hidden rather than overridden.'],
['Can private methods be overridden?',['Yes','No','Only by interfaces','Only with super'],1,'Private methods are not inherited, so they cannot be overridden.'],
['Can an abstract class have a constructor?',['Yes','No','Only private','Only static'],0,'Abstract classes can define constructors, which execute during subclass construction.'],
['Can an interface have default methods?',['No','Yes','Only before Java 8','Only with constructors'],1,'Java 8 introduced default and static interface methods; later Java versions also allow private interface methods.'],
['What does composition represent?',['Has-a relationship','Is-a relationship only','Compilation','Overloading'],0,'Composition models an object using or owning another object.'],
['What is the diamond problem?',['Memory leak','Ambiguity from multiple inheritance','A SQL error','A constructor error'],1,'It describes ambiguity when multiple parents provide conflicting inherited behavior.'],
['What is abstraction?',['Exposing only essential behavior','Making all fields public','Avoiding classes','Using only primitives'],0,'Abstraction hides unnecessary implementation detail behind a simpler contract.'],
['What does Liskov Substitution mean?',['Subtypes should be usable where the base type is expected','Every class must be final','All methods must be static','Every object needs an interface'],0,'A valid subtype should preserve the expectations of clients using the base type.'] ]};
const topic=new URLSearchParams(location.search).get('topic')==='oop'?'oop':'core-java';const questions=BANK[topic];const title=topic==='oop'?'OOP':'Core Java';let index=0,answers=Array(questions.length).fill(null);
const quiz=document.querySelector('#quiz');
function render(){const q=questions[index];quiz.innerHTML=`<div class="test-head"><span class="muted">${title} Test</span><h1>Question ${index+1} of ${questions.length}</h1><p class="muted">Choose one answer. You can move back and change it.</p><div class="progress"><span style="width:${(index/questions.length)*100}%"></span></div></div><section class="card"><h2>${q[0]}</h2>${q[1].map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[index]===i?'checked':''}>${o}</label>`).join('')}<div class="buttons"><button class="btn secondary" id="prev" ${index===0?'disabled':''}>Previous</button><button class="btn" id="next">${index===questions.length-1?'Submit Test':'Next'}</button></div></section>`;document.querySelector('#prev').onclick=()=>{save();if(index>0){index--;render()}};document.querySelector('#next').onclick=()=>{if(!save()){alert('Please select an answer.');return}if(index<questions.length-1){index++;render()}else{showResult()}}}
function save(){const selected=document.querySelector('input[name="answer"]:checked');if(!selected)return false;answers[index]=Number(selected.value);return true}
function showResult(){let score=0;answers.forEach((a,i)=>{if(a===questions[i][2])score++});let html=`<section class="card result" style="display:block"><p class="muted">${title} Test Complete</p><div class="score">${score} / ${questions.length}</div><h2>${Math.round(score/questions.length*100)}%</h2><p class="muted">Correct: ${score} &nbsp; | &nbsp; Wrong: ${questions.length-score}</p><div id="reviews">`;questions.forEach((q,i)=>{const ok=answers[i]===q[2];html+=`<div class="review ${ok?'right':'wrong'}"><strong>${i+1}. ${q[0]}</strong><p>Your answer: <b>${answers[i]===null?'Not answered':q[1][answers[i]]}</b></p><p>Correct answer: <b>${q[1][q[2]]}</b></p><p class="explain">${q[3]}</p></div>`});html+=`</div><button class="btn restart" onclick="location.reload()">Retake Test</button></section>`;quiz.innerHTML=html}
const themeBtn=document.querySelector('#themeBtn');if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeBtn.textContent='☀'}themeBtn.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');themeBtn.textContent=d?'☀':'◐';localStorage.setItem('theme',d?'dark':'light')};render();
</script></body></html>

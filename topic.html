<script>
const CORE=[
['Java platform basics','Java is a high-level, class-based language. Source code is compiled to bytecode and executed by the JVM, which enables the same compiled bytecode to run on supported platforms.','JDK contains development tools, libraries and a runtime. JRE provides the runtime libraries and JVM. JVM loads, verifies and executes bytecode.'],
['JDK vs JRE vs JVM','Remember: JDK = development, JRE = runtime, JVM = execution engine. javac is part of the JDK and converts .java source into .class bytecode.','Interview follow-up: Is JVM platform independent? The JVM implementation is platform-specific, but Java bytecode is designed to be platform independent.'],
['Java features','Common interview points: object-oriented, platform independent through bytecode, robust, secure, multithreaded, portable, garbage collected, dynamically linked and strongly typed.'],
['Primitive data types','Java has byte, short, int, long, float, double, char and boolean. Know ranges, default values for fields, widening and narrowing conversions.'],
['Variables and scope','Local variables must be initialized before use. Instance variables belong to objects. Static variables belong to the class. Scope depends on where a variable is declared.'],
['Operators and control flow','Know arithmetic, relational, logical, bitwise, ternary and assignment operators. Be comfortable with if/else, switch, for, enhanced for, while, do-while, break and continue.'],
['Classes and objects','A class defines state and behavior; an object is an instance. A reference variable stores a reference to an object rather than the object itself.'],
['Constructors','A constructor initializes an object and has the same name as the class with no return type. Constructors can be overloaded. If you declare no constructor, the compiler may provide a default no-argument constructor.'],
['this and super','this refers to the current object. super refers to the immediate parent class portion and can access parent constructors, fields and methods.'],
['static','Static members belong to the class. A static method cannot directly access instance state because it has no implicit this reference. Static blocks run when the class is initialized.'],
['final','A final variable cannot be reassigned after initialization. A final method cannot be overridden. A final class cannot be extended. final reference does not make the referenced object immutable.'],
['Access modifiers','private is class-only; package-private is same package; protected permits same-package access plus qualified subclass access rules; public is broadly accessible.'],
['String','String is immutable. String literals may be stored in the string pool. Use equals for content comparison. Repeated concatenation in loops is usually better handled with StringBuilder.'],
['StringBuilder vs StringBuffer','Both are mutable character sequences. StringBuilder is generally preferred for single-threaded code; StringBuffer has synchronized methods and is usually slower.'],
['Arrays','Arrays have fixed length. Know traversal, sorting, searching, copying, Arrays utility methods and common array interview problems.'],
['Wrapper classes and autoboxing','Wrapper classes represent primitives as objects: Integer, Long, Double, Boolean, Character, etc. Autoboxing converts primitive to wrapper and unboxing does the reverse. Beware null unboxing and Integer caching behavior.'],
['Pass by value','Java is always pass-by-value. For object arguments, the value passed is a copy of the reference. A method can mutate the referenced object but cannot replace the caller’s reference itself.'],
['equals and hashCode','equals defines logical equality when overridden. The hashCode contract requires equal objects to have equal hash codes. Hash-based collections depend on this contract.'],
['Exception handling','Know checked exceptions, unchecked exceptions, Error, try/catch/finally, throw, throws, custom exceptions and try-with-resources. Avoid swallowing exceptions silently.'],
['Garbage collection','Objects become eligible for GC when they are no longer reachable. System.gc is only a request. Java does not provide deterministic object destruction.'],
['Generics','Generics provide compile-time type safety. Know type parameters, bounded wildcards, ? extends, ? super, raw types and type erasure.'],
['Enums','Enums represent a fixed set of constants and can have fields, constructors and methods. They are useful for type-safe states and categories.'],
['Packages and imports','Packages organize classes and provide namespace/access boundaries. import only makes names easier to reference; it does not copy classes.'],
['Object class','Important methods include equals, hashCode, toString, getClass, clone, wait, notify and notifyAll. Understand which are commonly overridden.'],
['Immutability','An immutable object cannot change its observable state after construction. Use private final state, no mutators, defensive copies for mutable fields and controlled construction.'],
['Comparable vs Comparator','Comparable defines a natural ordering inside the type using compareTo. Comparator supplies an external ordering and supports multiple sorting strategies.'],
['Java memory basics','Know stack frames for method execution, heap for objects, metaspace for class metadata, and the fact that implementation details vary by JVM. Avoid memorizing oversimplified diagrams as absolute rules.'],
['Common tricky basics','Know == vs equals, String pool, Integer caching, static initialization order, constructor chaining, overloading resolution, overriding rules, final/reference behavior and pass-by-value.']
];
const OOP=[
['What is OOP?','Object-oriented programming organizes software around objects that combine state and behavior. Java uses classes, objects, inheritance, interfaces and composition to model systems.'],
['Four pillars','Encapsulation controls access to state; inheritance reuses and specializes behavior; polymorphism lets a common type represent different implementations; abstraction exposes essential behavior while hiding implementation details.'],
['Encapsulation','Use private state and controlled methods. Good encapsulation is more than getters/setters: methods can enforce invariants and prevent invalid state.'],
['Inheritance','Use extends for class inheritance. Java supports single inheritance of classes. Inheritance represents an is-a relationship and should be used when substitutability makes sense.'],
['Types of inheritance','Common forms are single, multilevel and hierarchical. Multiple inheritance of classes is not supported. Multiple interfaces can be implemented.'],
['Polymorphism','Compile-time polymorphism is commonly associated with overloading. Runtime polymorphism occurs when an overridden instance method is selected using the actual object type.'],
['Method overloading','Same method name with different parameter lists. Return type alone cannot distinguish overloads. Resolution happens at compile time.'],
['Method overriding','A subclass provides a compatible implementation of an inherited instance method. Visibility cannot be reduced. Static methods are hidden, not overridden.'],
['Dynamic method dispatch','For an overridden instance method, the JVM dispatches to the implementation belonging to the runtime object, even when the reference type is the parent.'],
['Abstraction','Expose what a component does while hiding unnecessary implementation detail. Java uses interfaces and abstract classes to model abstraction.'],
['Abstract class','Can have constructors, instance state, concrete methods and abstract methods. A class can extend only one class.'],
['Interface','Defines a contract/type that classes can implement. Modern Java interfaces may have abstract, default, static and private methods, but no constructors and no ordinary instance fields.'],
['Abstract class vs interface','Choose an abstract class when shared state or partial implementation belongs in a common base. Choose an interface for a contract/capability that can be implemented by otherwise unrelated classes.'],
['Multiple interfaces and diamond problem','A class can implement multiple interfaces. If inherited default methods conflict, the class must resolve the conflict explicitly. Java avoids multiple class inheritance.'],
['Composition vs inheritance','Composition is a has-a relationship where an object delegates to or contains other objects. It is often more flexible than deep inheritance hierarchies.'],
['Association, aggregation, composition','Association is a general relationship. Aggregation is a weaker whole-part relationship with independent lifecycles. Composition is stronger ownership with lifecycle dependency.'],
['IS-A vs HAS-A','Dog IS-A Animal suggests inheritance. Car HAS-A Engine suggests composition. Use these as modeling hints, not rigid rules.'],
['Constructors in inheritance','Constructors are not inherited. A subclass constructor invokes a superclass constructor directly or implicitly. Constructor execution proceeds from the parent constructor toward the child constructor.'],
['this vs super','this accesses the current class object or constructor; super accesses the immediate parent implementation/constructor. this() and super() must be the first constructor statement.'],
['Access control and overriding','An overriding method cannot be more restrictive than the parent method. A private method is not overridden because it is not inherited.'],
['final and inheritance','A final class cannot be extended. A final method cannot be overridden. A final reference can still refer to a mutable object whose internal state changes.'],
['Object class and OOP','Every Java class ultimately derives from Object. toString, equals and hashCode are important object contracts and are commonly overridden.'],
['equals and identity','== checks primitive values or reference identity. equals is intended for logical equality when a class implements the appropriate contract.'],
['SOLID basics','Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation and Dependency Inversion are design principles used to keep OOP systems maintainable.'],
['Liskov Substitution Principle','A subtype should be usable wherever its base type is expected without breaking the client’s valid assumptions.'],
['Dependency inversion','High-level policy should depend on abstractions rather than concrete low-level implementations. Dependency injection is one practical technique that supports this principle.'],
['Encapsulation vs abstraction','Encapsulation focuses on controlling and protecting state/implementation boundaries. Abstraction focuses on exposing essential behavior while hiding unnecessary details.'],
['Coupling and cohesion','Low coupling reduces dependencies between components. High cohesion keeps related responsibilities together. Good OOP design usually aims for both.']
];
const CODE={
core:[['== vs equals','String a = new String("Java");\nString b = new String("Java");\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));'],['StringBuilder','StringBuilder sb = new StringBuilder("Java");\nsb.append(" Interview");\nsb.reverse();\nSystem.out.println(sb);'],['Pass by value','class Demo {\n    static void change(int x) { x = 20; }\n    public static void main(String[] args) {\n        int x = 10;\n        change(x);\n        System.out.println(x);\n    }\n}'],['Immutable class','final class User {\n    private final String name;\n    User(String name) { this.name = name; }\n    public String getName() { return name; }\n}']],
oop:[['Runtime polymorphism','class Animal {\n    void sound() { System.out.println("Animal"); }\n}\nclass Dog extends Animal {\n    @Override\n    void sound() { System.out.println("Bark"); }\n}\nAnimal a = new Dog();\na.sound();'],['Encapsulation','class BankAccount {\n    private double balance;\n\n    public void deposit(double amount) {\n        if (amount > 0) balance += amount;\n    }\n\n    public double getBalance() { return balance; }\n}'],['Interface','interface Payment {\n    void pay(double amount);\n}\nclass UpiPayment implements Payment {\n    public void pay(double amount) {\n        System.out.println("Paid: " + amount);\n    }\n}'],['Composition','class Engine {\n    void start() { System.out.println("Engine started"); }\n}\nclass Car {\n    private final Engine engine = new Engine();\n    void start() { engine.start(); }\n}']]
};
const QUESTIONS={
core:[['What is the difference between JDK, JRE and JVM?','JDK is for development, JRE provides runtime libraries and JVM executes bytecode.'],['Why is Java platform independent?','Java source is compiled to platform-independent bytecode, which runs on a JVM implementation for the target platform.'],['Is Java purely object-oriented?','No. Java has primitive types and supports static members, so not everything is an object.'],['Why is String immutable?','Immutability supports safe sharing, string pooling, stable hashing and thread-friendly read-only behavior.'],['== vs equals()?','For references, == checks identity; equals is for logical equality when properly overridden.'],['Why override hashCode when overriding equals?','Equal objects must have equal hash codes for hash-based collections to work correctly.'],['Is Java pass-by-reference?','No. Java is pass-by-value. For objects, the copied value is a reference.'],['StringBuilder vs StringBuffer?','Both are mutable. StringBuilder is generally preferred when synchronization is not required; StringBuffer methods are synchronized.'],['What is method overloading?','Same method name with different parameter lists; resolution is at compile time.'],['What is method overriding?','A subclass provides a compatible implementation of an inherited instance method; dispatch occurs at runtime.'],['What does final mean?','A final variable cannot be reassigned, a final method cannot be overridden and a final class cannot be extended.'],['Can a final reference change?','The reference cannot point to another object, but the referenced mutable object can change.'],['What is constructor chaining?','One constructor invokes another constructor using this() or a parent constructor using super().'],['What is garbage collection?','Automatic reclamation of unreachable objects; the JVM decides when and how collection occurs.'],['Checked vs unchecked exception?','Checked exceptions are generally enforced by the compiler; unchecked exceptions derive from RuntimeException.'],['What is try-with-resources?','A construct that automatically closes AutoCloseable resources after the try block.'],['What are generics?','Compile-time type parameters that improve type safety and reduce casts.'],['Comparable vs Comparator?','Comparable defines natural ordering in the type; Comparator defines external/custom ordering.'],['What is an immutable object?','An object whose observable state cannot change after construction.'],['What is the string pool?','A JVM-managed pool of canonical String instances used to reduce duplicate immutable String objects.']],
oop:[['What are the four pillars of OOP?','Encapsulation, inheritance, polymorphism and abstraction.'],['What is encapsulation?','Combining state and behavior while controlling direct access to internal state.'],['What is inheritance?','A subclass derives from a superclass using extends, forming an is-a relationship.'],['Does Java support multiple inheritance?','A class cannot extend multiple classes, but it can implement multiple interfaces.'],['What is polymorphism?','A common type can represent different concrete implementations; overriding enables runtime polymorphism.'],['Overloading vs overriding?','Overloading changes parameters and is compile-time; overriding replaces inherited instance behavior and is runtime.'],['What is abstraction?','Exposing essential behavior while hiding implementation details.'],['Abstract class vs interface?','Abstract classes can hold instance state and constructors; interfaces define contracts and support multiple implementation.'],['Can an interface have method implementations?','Yes. Modern Java interfaces can have default, static and private method implementations.'],['Can an abstract class have a constructor?','Yes. Its constructor runs as part of subclass construction.'],['Are constructors inherited?','No. A subclass constructor invokes a superclass constructor, but constructors themselves are not inherited.'],['What is dynamic method dispatch?','Runtime selection of an overridden instance method based on the actual object type.'],['What is composition?','A has-a relationship where a class uses/owns another object, often favoring flexible design over deep inheritance.'],['What is the diamond problem?','Ambiguity that can occur with multiple inheritance when two parents provide conflicting implementations. Java avoids multiple class inheritance.'],['What is IS-A vs HAS-A?','IS-A suggests inheritance; HAS-A suggests composition/association.'],['What is Liskov Substitution Principle?','Subtypes should be usable wherever the base type is expected without violating valid client assumptions.'],['What is tight coupling?','A design where components depend heavily on concrete details, making change and testing harder.'],['What is high cohesion?','A component has closely related responsibilities rather than unrelated responsibilities.'],['Can static methods be overridden?','No. Static methods are hidden when a subclass declares a method with the same signature.'],['Can private methods be overridden?','No. Private methods are not inherited and therefore cannot be overridden.']]
};
const key=new URLSearchParams(location.search).get('topic')||'core-java';
const isOop=key==='oop'; const title=isOop?'OOP':'Core Java'; const list=isOop?OOP:CORE; const q=isOop?QUESTIONS.oop:QUESTIONS.core; const code=isOop?CODE.oop:CODE.core;
document.title=title+' | Java Interview Prep';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
let html=`<a class="back" href="index.html#topics">← Back to topics</a><section class="topic-hero"><div style="font-size:34px">${isOop?'🧩':'☕'}</div><h1>${title}</h1><p>${isOop?'Master the four pillars, class design, inheritance, polymorphism, abstraction and OOP design principles.':'Build the complete Java foundation required for interviews, from syntax and memory basics to exceptions, generics and object contracts.'}</p><div class="actions"><a class="primary" href="test.html?topic=${key}">📝 Take ${title} Test</a><a href="#questions">Interview Questions</a></div></section>`;
list.forEach((s,i)=>{html+=`<section class="lesson"><h2>${i+1}. ${esc(s[0])}</h2><p>${esc(s[1])}</p>${s[2]?`<div class="tip"><strong>Interview focus:</strong> ${esc(s[2])}</div>`:''}</section>`});
html+=`<section class="lesson"><h2>💻 Coding Examples</h2><p>Use these examples to understand the concept and practice explaining the code in an interview.</p>`;
code.forEach(c=>html+=`<h3>${esc(c[0])}</h3><pre><code>${esc(c[1])}</code></pre>`); html+=`</section><section class="lesson" id="questions"><h2>🎯 ${q.length} Interview Questions & Answers</h2>`;
q.forEach((x,i)=>html+=`<div class="qa"><strong>${i+1}. ${esc(x[0])}</strong><div class="answer">${esc(x[1])}</div></div>`);
html+=`</section><div class="topic-nav"><a href="index.html#topics">← All topics</a><a href="test.html?topic=${key}">Take the test →</a></div>`;
document.querySelector('#content').innerHTML=html;
const themeBtn=document.querySelector('#themeBtn'); if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeBtn.textContent='☀'} themeBtn.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');themeBtn.textContent=d?'☀':'◐';localStorage.setItem('theme',d?'dark':'light')};
</script></body></html>

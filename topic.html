  <style>
    .topic-page{max-width:1000px;margin:auto;padding:55px 24px 90px}.back{display:inline-flex;margin-bottom:28px;color:var(--accent-dark);font-weight:700;text-decoration:none}.topic-hero{padding:35px 0 45px;border-bottom:1px solid var(--line)}.topic-hero h1{font-size:clamp(40px,7vw,68px);line-height:1.05;letter-spacing:-.05em;margin:0 0 15px}.topic-hero p{max-width:720px;color:var(--muted);font-size:18px}.lesson{margin-top:30px;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.lesson h2{margin-top:0;font-size:25px}.lesson h3{margin-bottom:7px}.lesson p{color:var(--muted)}.lesson pre{background:var(--code);color:#eee;border-radius:12px;padding:20px;overflow:auto;font:500 13px/1.7 'JetBrains Mono',monospace}.lesson code{font-family:'JetBrains Mono',monospace}.question{margin-top:20px;padding:20px;border-left:4px solid var(--accent-dark);background:var(--bg)}.question strong{display:block;margin-bottom:6px}.topic-nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.topic-nav a{padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);background:var(--surface);font-weight:700}@media(max-width:600px){.topic-page{padding-top:35px}.lesson{padding:22px}.topic-nav{flex-direction:column}}
  </style>

<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">☕</span><span>Java Interview Prep</span></a>
  <nav class="nav"><a href="index.html#topics">Topics</a><a href="index.html#roadmap">Roadmap</a><a href="index.html#practice">Practice</a></nav>

</header>
<main class="topic-page" id="content"></main>
<script>
const data={
 'core-java':{icon:'☕',title:'Core Java',intro:'Build the foundation you need for almost every Java interview.',sections:[['JDK vs JRE vs JVM','JDK is used to develop Java applications. JRE provides the runtime environment. JVM executes Java bytecode. A simple way to remember it: JDK contains the tools, JRE provides runtime libraries, and JVM executes the bytecode.'],['Interview question','What is the difference between == and equals() for objects?','For objects, == compares references. equals() is used for logical equality when the class provides an appropriate implementation.'],['Code example','public class Example {\n    public static void main(String[] args) {\n        String a = new String("Java");\n        String b = new String("Java");\n\n        System.out.println(a == b);\n        System.out.println(a.equals(b));\n    }\n}']]},
 'oop':{icon:'🧩',title:'OOP',intro:'Understand the four pillars of object-oriented programming and how interviewers test them.',sections:[['The four pillars','Encapsulation keeps data and behavior together. Inheritance allows reuse through an is-a relationship. Polymorphism allows one interface or parent type to represent different implementations. Abstraction hides unnecessary implementation details.'],['Interview question','Overloading vs overriding?','Overloading means same method name with different parameters and is resolved at compile time. Overriding means a child class provides a new implementation of an inherited method and is resolved at runtime.'],['Code example','class Animal {\n    void sound() { System.out.println("Animal sound"); }\n}\n\nclass Dog extends Animal {\n    @Override\n    void sound() { System.out.println("Bark"); }\n}']]},
 'collections':{icon:'📦',title:'Collections',intro:'Master List, Set, Map, hashing and the questions that appear repeatedly in interviews.',sections:[['ArrayList vs LinkedList','ArrayList is backed by a dynamic array and gives fast random access. LinkedList is node-based and can be useful for frequent insertions/removals through known positions, but random access is slower.'],['Interview question','How does HashMap work at a high level?','HashMap uses a hash of the key to locate a bucket. It compares keys using hashCode() and equals(). Collisions are handled within the bucket. Modern Java can use tree structures for heavily-collided buckets.'],['Code example','Map<String, Integer> scores = new HashMap<>();\nscores.put("Java", 10);\nscores.put("Spring", 8);\n\nSystem.out.println(scores.get("Java"));']]},
 'java-8':{icon:'⚡',title:'Java 8+',intro:'Learn lambdas, functional interfaces and streams with interview-focused examples.',sections:[['Lambda expressions','A lambda is a concise way to represent behavior for a functional interface. It is commonly used with collections and streams.'],['Interview question','What is a functional interface?','An interface with exactly one abstract method. It can still contain default and static methods. Examples include Predicate, Function, Consumer and Supplier.'],['Code example','List<Integer> numbers = List.of(1, 2, 3, 4, 5);\n\nList<Integer> even = numbers.stream()\n    .filter(n -> n % 2 == 0)\n    .toList();\n\nSystem.out.println(even);']]},
 'spring-boot':{icon:'🌱',title:'Spring Boot',intro:'Prepare for backend interviews with dependency injection, REST APIs and application flow.',sections:[['Controller → Service → Repository','A controller handles the HTTP request and response. A service contains business logic. A repository handles persistence. DTOs are commonly used to control the data exposed between API and application layers.'],['Interview question','Why is constructor injection preferred?','Dependencies are explicit, required dependencies can be final, and the class is easier to test without relying on field injection.'],['Code example','@RestController\nclass UserController {\n    private final UserService service;\n\n    UserController(UserService service) {\n        this.service = service;\n    }\n}']]},
 'sql-db':{icon:'🗄️',title:'SQL & DB',intro:'Practice joins, grouping, indexes, transactions and Oracle-friendly database concepts.',sections:[['JOIN basics','INNER JOIN returns matching rows from both tables. LEFT JOIN keeps every row from the left table and matching rows from the right table when available.'],['Interview question','WHERE vs HAVING?','WHERE filters rows before grouping. HAVING filters groups after GROUP BY and is commonly used with aggregate conditions.'],['Code example','SELECT department_id, COUNT(*)\nFROM employees\nWHERE salary > 50000\nGROUP BY department_id\nHAVING COUNT(*) > 2;']]},
 'practice':{icon:'🎯',title:'Interview Practice',intro:'Use this section for rapid-fire revision and practical interview questions.',sections:[['Question 1','What happens when you add a key-value pair to a HashMap?','Java calculates the key hash, identifies a bucket, and stores the mapping there. If another key maps to the same bucket, collision handling is used.'],['Question 2','Why should equals() and hashCode() be consistent?','Hash-based collections use hashCode() to locate a bucket and equals() to identify the matching key. Equal objects must return the same hash code.'],['Code example','String input = "java";\nString reversed = new StringBuilder(input)\n    .reverse()\n    .toString();\nSystem.out.println(reversed);']]}
};
const params=new URLSearchParams(location.search);const key=params.get('topic')||'core-java';const d=data[key]||data['core-java'];
document.title=d.title+' | Java Interview Prep';
const content=document.querySelector('#content');
content.innerHTML=`<a class="back" href="index.html#topics">← Back to topics</a><section class="topic-hero"><div class="topic-icon" style="font-size:34px">${d.icon}</div><h1>${d.title}</h1><p>${d.intro}</p></section>${d.sections.map((s,i)=>`<section class="lesson"><h2>${s[0]}</h2>${s[1]?`<p>${s[1]}</p>`:''}${s[2]?`<div class="question"><strong>${s[1]}</strong><span>${s[2]}</span></div>`:''}${s[0]==='Code example'?`<pre><code>${s[1].replaceAll('&','&amp;').replaceAll('<','&lt;')}</code></pre>`:''}</section>`).join('')}<div class="topic-nav"><a href="index.html#topics">← All topics</a><a href="index.html#practice">Interview practice →</a></div>`;
const themeBtn=document.querySelector('#themeBtn');if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeBtn.textContent='☀';}themeBtn.addEventListener('click',()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');themeBtn.textContent=dark?'☀':'◐';localStorage.setItem('theme',dark?'dark':'light')});
</script>
